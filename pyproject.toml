[project]
name = "dataset-prep"
description = "Utilities for preparing datasets for publication"
readme = "README.md"
license = {text = "Apache-2"}
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "frictionless>=5.18.1",
    "polars>=1.36.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dataset_prep/__init__.py"

[project.scripts]
dataset-readme-info = "dataset_prep.readme_info:main"
